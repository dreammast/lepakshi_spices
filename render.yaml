services:
  - type: web
    name: lepakshi-spices-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: lepakshispices
      - key: DB_SSL_CA_PATH
        value: certs/tidb-ca.pem
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: MAIL_FROM
        value: "Lepakshi Spices <dreammasterorigin@gmail.com>"
      - key: FRONTEND_URL
        value: https://lepakshi-spices-user.vercel.app
      - key: ADMIN_FRONTEND_URL
        value: https://lepakshi-spices-admin.vercel.app
      # The following sensitive variables should be set in the Render Dashboard
      # for security since this is a public repository.
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
